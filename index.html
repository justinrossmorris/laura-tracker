<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Laura's Daily Tracker</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: #f5f0eb;
  color: #3a3a3a;
  min-height: 100vh;
  max-width: 500px;
  margin: 0 auto;
  padding-bottom: 100px;
}

header {
  background: linear-gradient(135deg, #7c956b, #a8c090);
  padding: 20px 16px 12px;
  text-align: center;
  position: sticky;
  top: 0;
  z-index: 100;
}

header h1 {
  font-size: 20px;
  font-weight: 600;
  color: #fff;
  margin-bottom: 12px;
  letter-spacing: 0.3px;
}

.tab-bar {
  display: flex;
  gap: 4px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  padding: 0 2px 4px;
}
.tab-bar::-webkit-scrollbar { display: none; }

.tab-btn {
  flex: 0 0 auto;
  padding: 8px 12px;
  border: none;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
  background: rgba(255,255,255,0.25);
  color: rgba(255,255,255,0.85);
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}

.tab-btn.active {
  background: #fff;
  color: #5a7a4a;
  font-weight: 600;
  box-shadow: 0 2px 8px rgba(0,0,0,0.12);
}

.day-view {
  padding: 16px;
}

.day-header {
  font-size: 15px;
  font-weight: 600;
  color: #6b8f5e;
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid #d4c9bc;
}

.empty-state {
  text-align: center;
  padding: 48px 24px;
  color: #9a9080;
}

.empty-state .icon {
  font-size: 40px;
  margin-bottom: 12px;
}

.empty-state p {
  font-size: 15px;
  line-height: 1.5;
}

/* Entry list */
.entry-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.entry {
  background: #fff;
  border-radius: 12px;
  padding: 14px 16px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  transition: transform 0.15s, box-shadow 0.15s;
  position: relative;
}

.entry-row {
  display: flex;
  align-items: flex-start;
  gap: 12px;
}

.entry.checked {
  opacity: 0.55;
}

.entry-check {
  flex-shrink: 0;
  width: 22px;
  height: 22px;
  border: 2px solid #b8caa8;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 1px;
  transition: all 0.2s;
  background: #fff;
}

.entry-check.done {
  background: #7c956b;
  border-color: #7c956b;
}

.entry-check.done::after {
  content: 'â';
  color: #fff;
  font-size: 13px;
  font-weight: 700;
}

.entry-body {
  flex: 1;
  min-width: 0;
}

.entry-time {
  font-size: 12px;
  font-weight: 600;
  color: #7c956b;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 3px;
}

.entry-task {
  font-size: 15px;
  line-height: 1.4;
  color: #3a3a3a;
  word-wrap: break-word;
}

.entry-note {
  font-size: 13px;
  color: #8a8070;
  margin-top: 4px;
  font-style: italic;
  line-height: 1.4;
  word-wrap: break-word;
}

.entry-actions {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.entry-actions button {
  padding: 6px 14px;
  border: 1.5px solid #d4c9bc;
  border-radius: 8px;
  background: #faf8f5;
  cursor: pointer;
  font-size: 13px;
  font-family: inherit;
  font-weight: 500;
  color: #6b6050;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 36px;
  -webkit-tap-highlight-color: rgba(0,0,0,0.05);
}

.entry-actions button:active {
  background: #ede8e2;
  border-color: #c4b9ac;
}

.entry-actions .delete-btn {
  color: #c0564f;
  border-color: #e0c4c2;
}

/* Add button */
.add-btn {
  position: fixed;
  bottom: 24px;
  right: 24px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  border: none;
  background: linear-gradient(135deg, #7c956b, #6b8456);
  color: #fff;
  font-size: 28px;
  font-weight: 300;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(90,122,74,0.35);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 90;
  transition: transform 0.2s;
}

.add-btn:active { transform: scale(0.92); }

/* Modal overlay */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 200;
  align-items: flex-end;
  justify-content: center;
}

.modal-overlay.open {
  display: flex;
}

.modal {
  background: #fff;
  border-radius: 20px 20px 0 0;
  padding: 24px 20px 32px;
  width: 100%;
  max-width: 500px;
  max-height: 85vh;
  overflow-y: auto;
}

.modal h2 {
  font-size: 18px;
  font-weight: 600;
  color: #3a3a3a;
  margin-bottom: 20px;
}

.form-group {
  margin-bottom: 16px;
}

.form-group label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: #6b8f5e;
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.form-group input,
.form-group textarea {
  width: 100%;
  padding: 12px 14px;
  border: 1.5px solid #d4c9bc;
  border-radius: 10px;
  font-size: 16px;
  font-family: inherit;
  color: #3a3a3a;
  background: #faf8f5;
  transition: border-color 0.2s;
  -webkit-appearance: none;
}

.form-group input:focus,
.form-group textarea:focus {
  outline: none;
  border-color: #7c956b;
  background: #fff;
}

.form-group textarea {
  resize: vertical;
  min-height: 60px;
}

.form-group .hint {
  font-size: 12px;
  color: #9a9080;
  margin-top: 4px;
}

.modal-buttons {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}

.modal-buttons button {
  flex: 1;
  padding: 14px;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
}

.btn-cancel {
  background: #f0ebe5;
  color: #6b6050;
}

.btn-save {
  background: linear-gradient(135deg, #7c956b, #6b8456);
  color: #fff;
}

.btn-save:active { opacity: 0.85; }

/* Delete confirmation */
.confirm-bar {
  display: none;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #fff;
  padding: 16px 20px;
  box-shadow: 0 -2px 16px rgba(0,0,0,0.12);
  z-index: 200;
  text-align: center;
  max-width: 500px;
  margin: 0 auto;
}

.confirm-bar.open { display: block; }

.confirm-bar p {
  font-size: 15px;
  color: #3a3a3a;
  margin-bottom: 12px;
}

.confirm-bar .confirm-btns {
  display: flex;
  gap: 10px;
}

.confirm-bar .confirm-btns button {
  flex: 1;
  padding: 12px;
  border: none;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
}

.btn-delete-confirm {
  background: #d9534f;
  color: #fff;
}

.btn-delete-cancel {
  background: #f0ebe5;
  color: #6b6050;
}

/* Day action buttons (Complete All / Clear Checks) */
.day-actions {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
}

.day-actions button {
  flex: 1;
  padding: 10px 12px;
  border: 1.5px solid #d4c9bc;
  border-radius: 10px;
  background: #faf8f5;
  cursor: pointer;
  font-size: 13px;
  font-family: inherit;
  font-weight: 600;
  color: #6b6050;
  -webkit-tap-highlight-color: rgba(0,0,0,0.05);
  transition: background 0.15s, border-color 0.15s;
}

.day-actions button:active {
  background: #ede8e2;
  border-color: #c4b9ac;
}

.day-actions .complete-day-btn {
  color: #5a7a4a;
  border-color: #b8caa8;
}

.day-actions .clear-checks-btn {
  color: #9a9080;
}

/* Completion count display */
.completion-info {
  text-align: center;
  margin-top: 20px;
  padding: 14px;
  font-size: 13px;
  color: #7c956b;
  background: rgba(124,149,107,0.08);
  border-radius: 10px;
}

.completion-info .count {
  font-size: 22px;
  font-weight: 700;
  display: block;
  margin-bottom: 2px;
}

/* Streak counter at bottom of day view */
.streak-info {
  text-align: center;
  margin-top: 8px;
  padding: 12px;
  font-size: 13px;
  color: #9a9080;
}
</style>
</head>
<body>

<header>
  <h1>Laura's Daily Tracker</h1>
  <div class="tab-bar" id="tabBar"></div>
</header>

<div class="day-view" id="dayView"></div>

<button class="add-btn" id="addBtn" aria-label="Add entry">+</button>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">Add Entry</h2>
    <div class="form-group">
      <label for="entryTime">Time</label>
      <input type="time" id="entryTime">
    </div>
    <div class="form-group">
      <label for="entryTask">What to do</label>
      <input type="text" id="entryTask" placeholder="e.g. Take vitamins, Walk the dog">
    </div>
    <div class="form-group">
      <label for="entryNote">Note <span style="font-weight:400;text-transform:none;color:#9a9080">(optional)</span></label>
      <textarea id="entryNote" placeholder="Any extra details..."></textarea>
    </div>
    <div class="modal-buttons">
      <button class="btn-cancel" id="btnCancel">Cancel</button>
      <button class="btn-save" id="btnSave">Save</button>
    </div>
  </div>
</div>

<div class="confirm-bar" id="confirmBar">
  <p>Delete this entry?</p>
  <div class="confirm-btns">
    <button class="btn-delete-cancel" id="btnDeleteCancel">Keep</button>
    <button class="btn-delete-confirm" id="btnDeleteConfirm">Delete</button>
  </div>
</div>

<script>
(function() {
  const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const DAY_KEYS = ['sun','mon','tue','wed','thu','fri','sat'];
  const STORAGE_KEY = 'laura_tracker_data';
  const COMP_KEY = 'laura_tracker_completions';

  let currentDay = new Date().getDay(); // 0=Sun
  let editingId = null;
  let deletingId = null;
  let deletingDay = null;

  // --- Data ---
  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch(e) {}
    // Default: empty arrays for each day
    const data = {};
    DAY_KEYS.forEach(k => data[k] = []);
    return data;
  }

  function saveData(data) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e) {}
  }

  function loadCompletions() {
    try {
      const raw = localStorage.getItem(COMP_KEY);
      if (raw) return JSON.parse(raw);
    } catch(e) {}
    const c = {};
    DAY_KEYS.forEach(k => c[k] = 0);
    return c;
  }

  function saveCompletions(c) {
    try { localStorage.setItem(COMP_KEY, JSON.stringify(c)); } catch(e) {}
  }

  let data = loadData();
  let completions = loadCompletions();

  // --- Tabs ---
  function renderTabs() {
    const bar = document.getElementById('tabBar');
    bar.innerHTML = '';
    DAYS.forEach((name, i) => {
      const btn = document.createElement('button');
      btn.className = 'tab-btn' + (i === currentDay ? ' active' : '');
      btn.textContent = name.slice(0, 3);
      btn.addEventListener('click', () => {
        currentDay = i;
        renderTabs();
        renderDay();
      });
      bar.appendChild(btn);
    });
    // Scroll active tab into view
    const active = bar.querySelector('.active');
    if (active) active.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
  }

  // --- Format time for display ---
  function formatTime(t) {
    if (!t) return '';
    const [h, m] = t.split(':').map(Number);
    const ampm = h >= 12 ? 'PM' : 'AM';
    const h12 = h === 0 ? 12 : h > 12 ? h - 12 : h;
    return h12 + ':' + String(m).padStart(2, '0') + ' ' + ampm;
  }

  // --- Sort entries by time ---
  function sortEntries(entries) {
    return entries.slice().sort((a, b) => {
      if (!a.time && !b.time) return 0;
      if (!a.time) return 1;
      if (!b.time) return -1;
      return a.time.localeCompare(b.time);
    });
  }

  // --- Render day view ---
  function renderDay() {
    const view = document.getElementById('dayView');
    const key = DAY_KEYS[currentDay];
    const entries = sortEntries(data[key] || []);

    let html = '<div class="day-header">' + DAYS[currentDay] + '</div>';

    if (entries.length === 0) {
      html += '<div class="empty-state">';
      html += '<div class="icon">ð</div>';
      html += '<p>No entries yet.<br>Tap <strong>+</strong> to add your first one.</p>';
      html += '</div>';
    } else {
      // Day action buttons
      html += '<div class="day-actions">';
      html += '<button class="complete-day-btn" id="completeDayBtn">Complete Day</button>';
      html += '<button class="clear-checks-btn" id="clearChecksBtn">Clear Checks</button>';
      html += '</div>';
      html += '<div class="entry-list">';
      entries.forEach(entry => {
        const checkedClass = entry.done ? ' checked' : '';
        const doneClass = entry.done ? ' done' : '';
        html += '<div class="entry' + checkedClass + '" data-id="' + entry.id + '">';
        html += '<div class="entry-row">';
        html += '<div class="entry-check' + doneClass + '" data-id="' + entry.id + '"></div>';
        html += '<div class="entry-body">';
        if (entry.time) html += '<div class="entry-time">' + formatTime(entry.time) + '</div>';
        html += '<div class="entry-task">' + escapeHtml(entry.task) + '</div>';
        if (entry.note) html += '<div class="entry-note">' + escapeHtml(entry.note) + '</div>';
        html += '</div>';
        html += '</div>';
        html += '<div class="entry-actions">';
        html += '<button data-action="edit" data-id="' + entry.id + '">Edit</button>';
        html += '<button class="delete-btn" data-action="delete" data-id="' + entry.id + '">Delete</button>';
        html += '</div>';
        html += '</div>';
      });
      html += '</div>';

      // Completion count for today's checks
      const doneCount = entries.filter(e => e.done).length;
      html += '<div class="streak-info">' + doneCount + ' of ' + entries.length + ' complete</div>';

      // Days completed counter
      const dayComp = completions[key] || 0;
      if (dayComp > 0) {
        html += '<div class="completion-info"><span class="count">' + dayComp + '</span>day' + (dayComp === 1 ? '' : 's') + ' completed</div>';
      }
    }

    view.innerHTML = html;

    // Attach click handlers
    view.querySelectorAll('.entry-check').forEach(el => {
      el.addEventListener('click', () => toggleDone(el.dataset.id));
    });
    view.querySelectorAll('[data-action="edit"]').forEach(el => {
      el.addEventListener('click', () => openEdit(el.dataset.id));
    });
    view.querySelectorAll('[data-action="delete"]').forEach(el => {
      el.addEventListener('click', () => openDelete(el.dataset.id));
    });
    // Day action buttons
    var completeBtn = document.getElementById('completeDayBtn');
    if (completeBtn) completeBtn.addEventListener('click', completeDay);
    var clearBtn = document.getElementById('clearChecksBtn');
    if (clearBtn) clearBtn.addEventListener('click', clearChecks);
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  // --- Toggle done ---
  function toggleDone(id) {
    const key = DAY_KEYS[currentDay];
    const entry = (data[key] || []).find(e => e.id === id);
    if (entry) {
      entry.done = !entry.done;
      saveData(data);
      renderDay();
    }
  }

  // --- Complete Day / Clear Checks ---
  function completeDay() {
    const key = DAY_KEYS[currentDay];
    completions[key] = (completions[key] || 0) + 1;
    saveCompletions(completions);
    renderDay();
  }

  function clearChecks() {
    const key = DAY_KEYS[currentDay];
    (data[key] || []).forEach(e => e.done = false);
    saveData(data);
    renderDay();
  }

  // --- Add / Edit modal ---
  function openAdd() {
    editingId = null;
    document.getElementById('modalTitle').textContent = 'Add Entry';
    document.getElementById('entryTime').value = '';
    document.getElementById('entryTask').value = '';
    document.getElementById('entryNote').value = '';
    document.getElementById('modalOverlay').classList.add('open');
  }

  function openEdit(id) {
    const key = DAY_KEYS[currentDay];
    const entry = (data[key] || []).find(e => e.id === id);
    if (!entry) return;
    editingId = id;
    document.getElementById('modalTitle').textContent = 'Edit Entry';
    document.getElementById('entryTime').value = entry.time || '';
    document.getElementById('entryTask').value = entry.task || '';
    document.getElementById('entryNote').value = entry.note || '';
    document.getElementById('modalOverlay').classList.add('open');
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
    editingId = null;
  }

  function saveEntry() {
    const time = document.getElementById('entryTime').value;
    const task = document.getElementById('entryTask').value.trim();
    const note = document.getElementById('entryNote').value.trim();

    if (!task) {
      document.getElementById('entryTask').style.borderColor = '#d9534f';
      setTimeout(() => document.getElementById('entryTask').style.borderColor = '', 1500);
      return;
    }

    const key = DAY_KEYS[currentDay];
    if (!data[key]) data[key] = [];

    if (editingId) {
      const entry = data[key].find(e => e.id === editingId);
      if (entry) {
        entry.time = time;
        entry.task = task;
        entry.note = note;
      }
    } else {
      data[key].push({
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        time: time,
        task: task,
        note: note,
        done: false
      });
    }

    saveData(data);
    closeModal();
    renderDay();
  }

  // --- Delete ---
  function openDelete(id) {
    deletingId = id;
    deletingDay = currentDay;
    document.getElementById('confirmBar').classList.add('open');
  }

  function closeDelete() {
    document.getElementById('confirmBar').classList.remove('open');
    deletingId = null;
    deletingDay = null;
  }

  function confirmDelete() {
    if (!deletingId) return;
    const key = DAY_KEYS[deletingDay];
    data[key] = (data[key] || []).filter(e => e.id !== deletingId);
    saveData(data);
    closeDelete();
    renderDay();
  }

  // --- Event listeners ---
  document.getElementById('addBtn').addEventListener('click', openAdd);
  document.getElementById('btnCancel').addEventListener('click', closeModal);
  document.getElementById('btnSave').addEventListener('click', saveEntry);
  document.getElementById('btnDeleteCancel').addEventListener('click', closeDelete);
  document.getElementById('btnDeleteConfirm').addEventListener('click', confirmDelete);

  // Close modal on overlay tap
  document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  // Enter key saves
  document.getElementById('entryTask').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') saveEntry();
  });

  // --- Init ---
  renderTabs();
  renderDay();
})();
</script>
</body>
</html>
